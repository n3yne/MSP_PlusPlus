name: Build & Release

on:
  push:
    tags:
      - "v*" # Triggers on version tags like v0.0.1, v1.0.0, etc.
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Actions are pinned to a commit so a moved tag cannot change what builds the
# release. To update one, replace the commit and the version in its comment.

# Nothing gets more than read access unless a job asks for it.
permissions:
  contents: read

jobs:
  # A full release tag (v0.8.11) put on the same commit as a beta that built
  # successfully (v0.8.11-beta) is a promotion: the release was made as a
  # draft by Promote beta (promote.yml) with the beta's own files, and a
  # person published it. Nothing is rebuilt; store-submit sends the beta's
  # Store package to everyone.
  promoted:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      promoted: ${{ steps.find.outputs.promoted }}
      beta_run: ${{ steps.find.outputs.beta_run }}
    steps:
      - name: Is this a promoted beta?
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "promoted=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/v* || "$TAG" == *-* ]]; then exit 0; fi
          # Only when the release already carries the beta's files.
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx latest.yml || exit 0
          SHA=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          for BETA in $(gh api "repos/$REPO/git/matching-refs/tags/$TAG-" --jq '.[].ref | sub("^refs/tags/"; "")'); do
            [ "$(gh api "repos/$REPO/commits/$BETA" --jq .sha)" = "$SHA" ] || continue
            RUN=$(gh api "repos/$REPO/actions/workflows/build.yml/runs?event=push&branch=$BETA&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
            [ -n "$RUN" ] || continue
            echo "promoted=true" >> "$GITHUB_OUTPUT"
            echo "beta_run=$RUN" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is $BETA promoted. Not rebuilding; sending its Store package (run $RUN) to everyone."
            exit 0
          done

  build-windows:
    needs: promoted
    if: needs.promoted.outputs.promoted != 'true'
    runs-on: windows-latest

    # Building needs to read the code and nothing else. Only the release job
    # below may write to the repository.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The tag must carry package.json's version: v0.8.11 or a beta of it,
      # v0.8.11-beta. A beta is built as 0.8.11 so the same files can later be
      # promoted to the full release (promote.yml). The Store only accepts
      # whole version numbers, so each beta needs its own patch number.
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BASE="${TAG%%-*}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$BASE" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $PKG. Use v$PKG or v$PKG-beta."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # With the "publish" block in package.json, electron-builder also writes
      # latest.yml and the installer's .blockmap. The installed app reads latest.yml
      # from the release to find updates, so both must be attached to the release.
      # Native addons: Windows Hello (native/windows-hello, api.windowsHello) and
      # Windows device sign-on (native/windows-sso, api.windowsSso), and the
      # private clipboard (native/windows-clipboard, api.clipboard).
      - name: Build the native addons
        run: node scripts/build-native.js

      - name: Build portable EXE and installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Check update metadata
        shell: bash
        run: |
          test -f dist/latest.yml || { echo "dist/latest.yml is missing"; exit 1; }
          INSTALLER=$(sed -n 's/^path: //p' dist/latest.yml)
          echo "latest.yml points at: $INSTALLER"
          test -f "dist/$INSTALLER" || { echo "dist/$INSTALLER is missing"; exit 1; }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          retention-days: 90

      # Microsoft Store package (MSIX/AppX). It is built unsigned on purpose: the
      # Store signs it with Microsoft's certificate after upload. It is not put on
      # the GitHub release (an unsigned package can't be installed from there);
      # download it from the run's artifacts and upload it in Partner Center.
      # The Store copy doesn't update itself (src/main/updater.js, "store" mode).
      # See docs/microsoft-store.md.
      - name: Build Microsoft Store package
        run: npx electron-builder --win appx --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Check Store identity
        shell: bash
        run: |
          if grep -q PLACEHOLDER package.json; then
            echo "::warning::package.json build.appx still has placeholder identity values. Partner Center will refuse this package until they are replaced (docs/microsoft-store.md)."
          fi

      - name: Upload Microsoft Store artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-store
          path: dist/*.appx
          retention-days: 90

  build-mac:
    needs: promoted
    if: needs.promoted.outputs.promoted != 'true'
    runs-on: macos-latest

    # Building needs to read the code and nothing else. Only the release job
    # below may write to the repository.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build macOS DMG
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-build
          path: dist/*.dmg
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.promoted.outputs.promoted != 'true'
    needs: [promoted, build-windows, build-mac]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-build
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mac-build
          path: artifacts/

      # The release is usually published on the GitHub page first, with notes
      # (such as the generated "What's Changed"). Keep those: put the build
      # block on top and the existing notes below it. The block sits between
      # markers so a re-run replaces it instead of adding a second copy.
      - name: Build release notes
        env:
          CURRENT: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git tag --sort=-version:refname | grep -v "^${CURRENT}$" | head -1)
          # Files are named after package.json's version (0.8.11 for v0.8.11-beta).
          VERSION="${CURRENT#v}"
          VERSION="${VERSION%%-*}"
          START='<!-- msp-build-info:start -->'
          END='<!-- msp-build-info:end -->'

          # Existing notes, minus any build block an earlier run added.
          # Empty when the release doesn't exist yet (tag pushed directly).
          gh release view "$CURRENT" --repo "$GITHUB_REPOSITORY" --json body --jq .body > existing_body.md 2>/dev/null || : > existing_body.md
          awk -v s="$START" -v e="$END" '
            index($0, s) { skip = 1; next }
            skip && index($0, e) { skip = 0; next }
            !skip
          ' existing_body.md | tr -d '\r' | sed -e '/./,$!d' > existing_notes.md

          {
            echo "$START"
            echo "## MSP++ ${CURRENT}"
            echo ""
            echo "### Downloads"
            # The Store page always offers the newest version the Store has
            # certified. A beta reaches only the Beta flight's testers there.
            # promote.yml swaps the beta line for the full-release line.
            if [ "${CURRENT#*-}" != "$CURRENT" ]; then
              echo "- **Microsoft Store** — beta testers in the MSP++ Beta flight get this version from the [Microsoft Store](https://apps.microsoft.com/detail/9NVJX5HK84G2) once Microsoft certifies it (usually 1 to 3 days); everyone else there stays on the current release"
            else
              echo "- **Microsoft Store** — [install from the Microsoft Store](https://apps.microsoft.com/detail/9NVJX5HK84G2), signed by Microsoft and updated by the Store; this version arrives there once Microsoft certifies it (usually 1 to 3 days)"
            fi
            echo "- **Windows installer** — \`MSP-PlusPlus-Setup-${VERSION}.exe\`, installs for just you (\`%LOCALAPPDATA%\\Programs\\MSP++\`, no admin) or everyone (\`C:\\Program Files\\MSP++\`); after that, MSP++ downloads and installs new versions itself"
            echo "- **Windows portable** — \`MSP++ ${VERSION}.exe\`, no installation required (tells you about new versions but can't install them)"
            echo "- **macOS** — \`.dmg\` disk image, drag to Applications to install"
            # Generated notes already end with a Full Changelog link.
            if [ -n "$PREV" ] && ! grep -q "Full Changelog" existing_notes.md; then
              echo ""
              echo "**Full Changelog:** https://github.com/n3yne/MSP_PlusPlus/compare/${PREV}...${CURRENT}"
            fi
            echo ""
            echo "$END"
            if [ -s existing_notes.md ]; then
              echo ""
              cat existing_notes.md
            fi
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: MSP++ ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          # A tag like v0.7.6-beta.1 stays a pre-release, so installed copies
          # (which only look at the latest full release) don't update to it.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*

  # Sends the Store package to Partner Center after the GitHub release is
  # made. A full release (v0.8.11) goes to everyone; a beta (v0.8.11-beta) goes
  # to the Beta package flight, so only the testers in its flight group get it.
  # A tested beta is released to everyone with the Promote beta workflow
  # (promote.yml), which reuses this build. Microsoft certifies each submission
  # (usually 1-3 days). Setup is in docs/microsoft-store.md. Without the
  # secrets (or, for a beta, the STORE_BETA_FLIGHT_ID variable) this job does
  # nothing, so releases work as before.
  store-submit:
    # Also runs when the build jobs were skipped for a promoted beta.
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [promoted, build-windows, release]
    runs-on: windows-latest

    # The secrets can live on this environment (or as repository secrets). Add
    # a required reviewer to it in Settings > Environments to approve each
    # Store submission by hand.
    environment: microsoft-store

    permissions:
      contents: read
      actions: read

    env:
      STORE_PRODUCT_ID: 9NVJX5HK84G2
      IS_BETA: ${{ contains(github.ref_name, '-') }}
      BETA_FLIGHT_ID: ${{ vars.STORE_BETA_FLIGHT_ID }}
      PC_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
      PC_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
      PC_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
      PC_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}

    steps:
      - name: Check Store settings
        id: creds
        shell: bash
        run: |
          if [ -z "$PC_TENANT_ID" ] || [ -z "$PC_SELLER_ID" ] || [ -z "$PC_CLIENT_ID" ] || [ -z "$PC_CLIENT_SECRET" ]; then
            echo "::notice::Partner Center secrets aren't set, so this release wasn't sent to the Microsoft Store. See docs/microsoft-store.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ "$IS_BETA" = "true" ] && [ -z "$BETA_FLIGHT_ID" ]; then
            echo "::notice::This is a beta, and the STORE_BETA_FLIGHT_ID variable isn't set, so it wasn't sent to the Store. See docs/microsoft-store.md (Betas in the Store)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            if [ "$IS_BETA" = "true" ]; then echo "flight=$BETA_FLIGHT_ID" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Checkout repository
        if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Download Microsoft Store artifact
        if: steps.creds.outputs.ok == 'true' && needs.promoted.outputs.promoted != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-store
          path: store/

      # A promoted beta reuses the package the testers got (kept 90 days).
      - name: Download the beta's Store package
        if: steps.creds.outputs.ok == 'true' && needs.promoted.outputs.promoted == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-store
          path: store/
          run-id: ${{ needs.promoted.outputs.beta_run }}
          github-token: ${{ github.token }}

      - name: Submit to the Microsoft Store
        if: steps.creds.outputs.ok == 'true'
        uses: ./.github/actions/store-submit
        with:
          package-dir: store
          product-id: ${{ env.STORE_PRODUCT_ID }}
          flight-id: ${{ steps.creds.outputs.flight }}
