name: Check Store credentials

# Read-only check that the Partner Center secrets are set where the
# store-submit job (build.yml) reads them, and that they can sign in and
# see the app. Changes nothing in the Store. Run it from the Actions tab
# after setting or renewing the secrets.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/store-check.yml"
      - ".github/actions/store-submit/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    environment: microsoft-store

    env:
      STORE_PRODUCT_ID: 9NVJX5HK84G2
      PC_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
      PC_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
      PC_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
      PC_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
      BETA_FLIGHT_ID: ${{ vars.STORE_BETA_FLIGHT_ID }}

    steps:
      # Prints only the names of missing secrets, never values.
      - name: All four secrets are set
        shell: bash
        run: |
          missing=""
          [ -n "$PC_TENANT_ID" ] || missing="$missing PARTNER_CENTER_TENANT_ID"
          [ -n "$PC_SELLER_ID" ] || missing="$missing PARTNER_CENTER_SELLER_ID"
          [ -n "$PC_CLIENT_ID" ] || missing="$missing PARTNER_CENTER_CLIENT_ID"
          [ -n "$PC_CLIENT_SECRET" ] || missing="$missing PARTNER_CENTER_CLIENT_SECRET"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi
          echo "All four secrets are set."

      - name: Set up Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Sign in to Partner Center
        shell: pwsh
        run: |
          msstore reconfigure --tenantId "$env:PC_TENANT_ID" --sellerId "$env:PC_SELLER_ID" --clientId "$env:PC_CLIENT_ID" --clientSecret "$env:PC_CLIENT_SECRET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Can see the MSP++ app
        shell: pwsh
        run: |
          msstore apps get $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Can read its submission status
        shell: pwsh
        run: |
          msstore submission status $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Shows the package flights and their IDs. Put the Beta flight's ID in
      # the STORE_BETA_FLIGHT_ID repository variable (docs/microsoft-store.md).
      - name: List package flights
        shell: pwsh
        run: |
          # The CLI exits with 1 when there are no flights yet; that's fine here.
          msstore flights list $env:STORE_PRODUCT_ID
          exit 0

      # Checks the STORE_BETA_FLIGHT_ID variable names a real package flight.
      - name: Beta flight variable matches a flight
        shell: pwsh
        run: |
          if (-not $env:BETA_FLIGHT_ID) {
            Write-Host "::warning::STORE_BETA_FLIGHT_ID isn't set, so betas won't go to the Store."
            exit 0
          }
          Write-Host "STORE_BETA_FLIGHT_ID = $env:BETA_FLIGHT_ID"
          msstore flights get $env:STORE_PRODUCT_ID $env:BETA_FLIGHT_ID
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::STORE_BETA_FLIGHT_ID doesn't match a package flight of this app."
            exit 1
          }
