<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Copilot - MSP++</title>
<style>
  :root { color-scheme: light dark; --bg: #f3f4f6; --fg: #1f2937; --muted: #6b7280; --line: #d1d5db; --accent: #2563eb; --accent-fg: #fff; --warn: #92400e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1f2430; --fg: #e5e7eb; --muted: #9ca3af; --line: #374151; --accent: #3b82f6; --warn: #fbbf24; }
  }
  html, body { margin: 0; height: 46px; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 12px/1.35 "Segoe UI", system-ui, sans-serif; }
  .bar { box-sizing: border-box; height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
    border-bottom: 1px solid var(--line); }
  .text { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .bar[data-mode="fallback"] .text { color: var(--warn); }
  .bar[data-mode="idle"] .text, .bar[data-mode="working"] .text { color: var(--muted); }
  a.btn { flex: none; text-decoration: none; color: var(--fg); border: 1px solid var(--line); border-radius: 5px;
    padding: 4px 9px; white-space: nowrap; }
  a.btn:hover { border-color: var(--accent); }
  a.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="bar" id="bar" data-mode="idle">
  <span class="text" id="text">Copilot for MSP++</span>
  <a class="btn primary" id="use" href="https://msp-copilot.invalid/use" hidden>Use this reply</a>
  <a class="btn" id="copy" href="https://msp-copilot.invalid/copy" title="Copy the request to the clipboard again" hidden>Copy request</a>
  <a class="btn" id="details" href="https://msp-copilot.invalid/details" title="Copy a summary of the page's layout (no messages) for a bug report" hidden>Page details</a>
  <a class="btn" id="cancel" href="https://msp-copilot.invalid/cancel" title="Stop waiting and hide this window" hidden>Cancel</a>
  <a class="btn" id="hide" href="https://msp-copilot.invalid/hide" title="Hide this window">Hide</a>
</div>
<script>
  // Called by the AI Features plugin: { mode: idle|working|waiting|fallback, text }.
  window.setBar = function (state) {
    var mode = state && state.mode || "idle";
    var waiting = mode === "waiting" || mode === "fallback";
    document.getElementById("bar").setAttribute("data-mode", mode);
    document.getElementById("text").textContent = state && state.text || "";
    document.getElementById("use").hidden = !waiting;
    document.getElementById("copy").hidden = !waiting;
    document.getElementById("details").hidden = !waiting;
    document.getElementById("cancel").hidden = mode === "idle";
    document.getElementById("hide").hidden = mode !== "idle";
  };
</script>
</body>
</html>
